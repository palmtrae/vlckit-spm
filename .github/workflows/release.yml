name: Mirror current VLCKit releases

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vlckit-release
  cancel-in-progress: false

jobs:
  release:
    name: Discover, package, and publish
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Check out main with tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Test release tooling
        run: Tests/test-release-tools.sh

      - name: Release current upstream versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: Scripts/auto-release.sh
